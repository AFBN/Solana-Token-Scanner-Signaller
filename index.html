    &lt;div class="modal" id="about-modal"&gt;
        &lt;div class="modal-box" id="about-modal-box"&gt;
            &lt;div class="modal-close" id="about-close"&gt;×&lt;/div&gt;
            &lt;h2 class="modal-title"&gt;ℹ️ About Sentinel &amp; Disclaimer&lt;/h2&gt;
            &lt;div style="color: var(--text); line-height: 1.6; font-size: 1.05rem; overflow-y: auto; max-height: 60vh; padding-right: 15px;"&gt;
                &lt;h3 style="color: var(--accent); margin-top: 0;"&gt;⚠️ General Disclaimer&lt;/h3&gt;
                &lt;p style="color: var(--red); font-weight: bold; background: rgba(248,113,113,0.1); padding: 10px; border-radius: 6px; border: 1px solid var(--red);"&gt;This tool is for educational and informational purposes only. It is NOT financial advice.&lt;/p&gt;
                &lt;p&gt;Cryptocurrency trading, especially low-market-cap tokens on decentralized exchanges, involves extreme risk. The vast majority of new tokens are highly volatile and may be subject to malicious practices (e.g., "rug pulls", honeypots). Always Do Your Own Research (DYOR). You are solely responsible for your trading decisions.&lt;/p&gt;

                &lt;h3 style="color: var(--accent); margin-top: 25px;"&gt;🔍 How Sentinel Works (Transparency)&lt;/h3&gt;
                &lt;p&gt;Sentinel aggregates public blockchain data to provide a consolidated view of token metrics. Here is exactly how the data is sourced and calculated:&lt;/p&gt;
                &lt;ul style="padding-left: 20px; margin-bottom: 20px;"&gt;
                    &lt;li style="margin-bottom: 8px;"&gt;&lt;strong&gt;Data Sources &amp; Deep Batch Scanning:&lt;/strong&gt; Token prices, volume, liquidity, and market cap are fetched in real-time from DexScreener and Birdeye. The engine executes a user-defined number of sequential batch fetches (default 10 batches of 50 tokens each) combining both sources. When scanning for signals, batches are processed one by one until a qualifying token is found, ensuring efficient use of API calls.&lt;/li&gt;
                    &lt;li style="margin-bottom: 8px;"&gt;&lt;strong&gt;Safety Scores &amp; Open-Source Heuristics:&lt;/strong&gt; Primary scores are sourced from the &lt;strong&gt;Solsniffer API&lt;/strong&gt;. If Solsniffer is unreachable, Sentinel uses a fallback &lt;em&gt;Heuristic Algorithm&lt;/em&gt; integrating open-source analytic principles. Holder concentration is evaluated securely using the premium &lt;strong&gt;QuickNode RPC&lt;/strong&gt; endpoints via direct on-chain querying. The application allows users to supply their own premium Solana RPC URL via Settings (saved securely in local browser storage only) to bypass public rate limits.&lt;/li&gt;
                    &lt;li style="margin-bottom: 8px;"&gt;&lt;strong&gt;Greed &amp; Fear Index:&lt;/strong&gt; Fetches live, daily market sentiment data directly from the &lt;strong&gt;Alternative.me Crypto Fear &amp; Greed API&lt;/strong&gt;.&lt;/li&gt;
                    &lt;li style="margin-bottom: 8px;"&gt;&lt;strong&gt;Alpha Signals – Dual Modes:&lt;/strong&gt; For each market cap tier, Sentinel now provides two distinct signals: &lt;strong&gt;🚀 Most Likely to Run&lt;/strong&gt; (optimized for short-term hype – favors high volume, momentum, and very low age) and &lt;strong&gt;🛡️ Safe to HODL&lt;/strong&gt; (optimized for longer-term safety – favors high liquidity, low holder concentration, and established age). The toggle lets you switch between them. Both respect your filter settings.&lt;/li&gt;
                    &lt;li style="margin-bottom: 8px;"&gt;&lt;strong&gt;Sequential Scanning &amp; Animation:&lt;/strong&gt; When scanning for signals, the scanner processes one batch at a time and the signal box pulses with a green animation to indicate live search. This gives real‑time feedback while the system searches for the best candidate.&lt;/li&gt;
                    &lt;li style="margin-bottom: 8px;"&gt;&lt;strong&gt;Enhanced Token Analysis:&lt;/strong&gt; The modal now shows additional tokenomics: total holder count (estimated from Solsniffer if available), top 20 wallet concentration, a &lt;strong&gt;clone likelihood score&lt;/strong&gt; (0–100) that detects potential copy‑cat tokens based on name patterns, and mint authority status (if RPC data is accessible).&lt;/li&gt;
                    &lt;li style="margin-bottom: 8px;"&gt;&lt;strong&gt;Recently Boosted List:&lt;/strong&gt; A dedicated tab showing tokens that have experienced significant momentum in the last 6 hours, measured by volume-to-market-cap ratio and price increase. Ideal for spotting early runners.&lt;/li&gt;
                    &lt;li style="margin-bottom: 8px;"&gt;&lt;strong&gt;Wallet PnL / Search:&lt;/strong&gt; The search bar doubles as a robust Contract Address checker and a live Wallet Portfolio PnL visualizer directly rendering Birdeye's interface via iframe.&lt;/li&gt;
                    &lt;li style="margin-bottom: 8px;"&gt;&lt;strong&gt;BubbleMaps Integration:&lt;/strong&gt; Visual wallet mapping analysis is available directly inside the token analysis modal. Clicking the link will securely open BubbleMaps in a new external browser tab.&lt;/li&gt;
                &lt;/ul&gt;

                &lt;h3 style="color: var(--accent); margin-top: 25px;"&gt;📖 Robust Help Guide&lt;/h3&gt;
                &lt;p&gt;&lt;strong&gt;Tabs Navigation:&lt;/strong&gt;&lt;/p&gt;
                &lt;ul style="padding-left: 20px; margin-bottom: 20px;"&gt;
                    &lt;li&gt;&lt;strong&gt;New Tokens:&lt;/strong&gt; Sorts the aggregated list by the newest pair creation date.&lt;/li&gt;
                    &lt;li&gt;&lt;strong&gt;24h Volume:&lt;/strong&gt; Sorts by highest trading volume over the last 24 hours.&lt;/li&gt;
                    &lt;li&gt;&lt;strong&gt;Market Cap:&lt;/strong&gt; Sorts by Fully Diluted Valuation (FDV).&lt;/li&gt;
                    &lt;li&gt;&lt;strong&gt;Trending:&lt;/strong&gt; A custom algorithmic sort blending volume (70%) and liquidity (30%).&lt;/li&gt;
                    &lt;li&gt;&lt;strong&gt;Recently Boosted:&lt;/strong&gt; Sorts by a boost score = (24h volume / market cap) * (1 + max(0, 6h price change / 100)). This highlights tokens with sudden interest and upward momentum.&lt;/li&gt;
                &lt;/ul&gt;
                &lt;p&gt;&lt;strong&gt;Filters &amp; Settings:&lt;/strong&gt; Use the Settings gear to adjust batch depth, provide a custom RPC, and set filters for age, volume, holder concentration, graduation, and platforms. Optionally apply the same filters to the main token table.&lt;/p&gt;
                &lt;p&gt;&lt;strong&gt;Using the Table:&lt;/strong&gt; Click any row or the "View" button to open the Advanced Safety Report, providing a deeper dive into the token's metrics and risk profile. Hover over the &lt;code&gt;?&lt;/code&gt; icons in the table header for specific metric definitions.&lt;/p&gt;
                &lt;p&gt;&lt;strong&gt;Clone Detection:&lt;/strong&gt; The clone likelihood algorithm analyses the token name and symbol for patterns commonly seen in scam tokens (e.g., repeated words, misspellings, excessive emojis, etc.). A high score suggests the token may be a copy‑cat or low‑effort creation – proceed with caution.&lt;/p&gt;
            &lt;/div&gt;
            &lt;button class="close-button" id="about-btn-close" style="margin-top: 20px;"&gt;I Understand&lt;/button&gt;
        &lt;/div&gt;

    &lt;script&gt;
        (function() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            function init() {
                const logEl = document.getElementById('log');
                const tableBody = document.getElementById('token-table').querySelector('tbody');
                const emptyState = document.getElementById('empty-state');
                const modal = document.getElementById('detail-modal');
                const modalBody = document.getElementById('modal-body');
                const helpModal = document.getElementById('help-modal');
                const helpTitle = document.getElementById('help-modal-title');
                const helpContent = document.getElementById('help-modal-content');
                
                const aboutModal = document.getElementById('about-modal');
                const btnAbout = document.getElementById('btn-about');
                const aboutClose = document.getElementById('about-close');
                const aboutBtnClose = document.getElementById('about-btn-close');

                const settingsModal = document.getElementById('settings-modal');
                const btnSettings = document.getElementById('btn-settings');
                const settingsClose = document.getElementById('settings-close');
                const settingsBtnClose = document.getElementById('settings-btn-close');

                const batchSelect = document.getElementById('batch-select');
                const rpcInput = document.getElementById('rpc-input');
                
                // Filter inputs
                const filterAgeMin = document.getElementById('filter-age-min');
                const filterAgeMax = document.getElementById('filter-age-max');
                const filterVolMin = document.getElementById('filter-vol-min');
                const filterVolMax = document.getElementById('filter-vol-max');
                const filterHolderMax = document.getElementById('filter-holder-max');
                const filterGraduated = document.getElementById('filter-graduated');
                const platformCheckboxes = document.querySelectorAll('#platform-checkboxes input[type="checkbox"]');
                const filterTableCheckbox = document.getElementById('filter-table');
                
                let userBatchLimit = parseInt(localStorage.getItem('sentinel_batch_limit')) || 10;
                let userRpcUrl = localStorage.getItem('sentinel_rpc_url') || 'https://warmhearted-burned-water.solana-mainnet.quiknode.pro/99bf1f368b070c7540869e1b64ac736ebbfb7d28/';
                
                // Load filters from localStorage
                let filterSettings = {
                    ageMin: parseFloat(localStorage.getItem('sentinel_filter_age_min')) || 0,
                    ageMax: parseFloat(localStorage.getItem('sentinel_filter_age_max')) || null,
                    volMin: parseFloat(localStorage.getItem('sentinel_filter_vol_min')) || 0,
                    volMax: parseFloat(localStorage.getItem('sentinel_filter_vol_max')) || null,
                    holderMax: parseFloat(localStorage.getItem('sentinel_filter_holder_max')) || 100,
                    graduatedOnly: localStorage.getItem('sentinel_filter_graduated') === 'true',
                    platforms: JSON.parse(localStorage.getItem('sentinel_filter_platforms')) || [],
                    applyToTable: localStorage.getItem('sentinel_filter_table') === 'true'
                };
                
                if (userBatchLimit) batchSelect.value = userBatchLimit;
                if (userRpcUrl &amp;&amp; userRpcUrl !== 'https://warmhearted-burned-water.solana-mainnet.quiknode.pro/99bf1f368b070c7540869e1b64ac736ebbfb7d28/') {
                    rpcInput.value = userRpcUrl;
                }
                
                // Set filter UI values
                filterAgeMin.value = filterSettings.ageMin;
                filterAgeMax.value = filterSettings.ageMax !== null ? filterSettings.ageMax : '';
                filterVolMin.value = filterSettings.volMin;
                filterVolMax.value = filterSettings.volMax !== null ? filterSettings.volMax : '';
                filterHolderMax.value = filterSettings.holderMax;
                filterGraduated.checked = filterSettings.graduatedOnly;
                filterTableCheckbox.checked = filterSettings.applyToTable;
                platformCheckboxes.forEach(cb =&gt; {
                    cb.checked = filterSettings.platforms.includes(cb.value);
                });
                
                function saveSettings() {
                    userBatchLimit = parseInt(batchSelect.value);
                    localStorage.setItem('sentinel_batch_limit', userBatchLimit);
                    
                    const inputRpc = rpcInput.value.trim();
                    if(inputRpc) {
                        userRpcUrl = inputRpc;
                        localStorage.setItem('sentinel_rpc_url', userRpcUrl);
                    } else {
                        userRpcUrl = 'https://warmhearted-burned-water.solana-mainnet.quiknode.pro/99bf1f368b070c7540869e1b64ac736ebbfb7d28/';
                        localStorage.removeItem('sentinel_rpc_url');
                    }
                    
                    // Save filters
                    const ageMinVal = parseFloat(filterAgeMin.value);
                    filterSettings.ageMin = isNaN(ageMinVal) ? 0 : ageMinVal;
                    const ageMaxVal = parseFloat(filterAgeMax.value);
                    filterSettings.ageMax = isNaN(ageMaxVal) ? null : ageMaxVal;
                    const volMinVal = parseFloat(filterVolMin.value);
                    filterSettings.volMin = isNaN(volMinVal) ? 0 : volMinVal;
                    const volMaxVal = parseFloat(filterVolMax.value);
                    filterSettings.volMax = isNaN(volMaxVal) ? null : volMaxVal;
                    const holderMaxVal = parseFloat(filterHolderMax.value);
                    filterSettings.holderMax = isNaN(holderMaxVal) ? 100 : holderMaxVal;
                    filterSettings.graduatedOnly = filterGraduated.checked;
                    const selectedPlatforms = Array.from(platformCheckboxes).filter(cb =&gt; cb.checked).map(cb =&gt; cb.value);
                    filterSettings.platforms = selectedPlatforms;
                    filterSettings.applyToTable = filterTableCheckbox.checked;
                    
                    localStorage.setItem('sentinel_filter_age_min', filterSettings.ageMin);
                    localStorage.setItem('sentinel_filter_age_max', filterSettings.ageMax !== null ? filterSettings.ageMax : '');
                    localStorage.setItem('sentinel_filter_vol_min', filterSettings.volMin);
                    localStorage.setItem('sentinel_filter_vol_max', filterSettings.volMax !== null ? filterSettings.volMax : '');
                    localStorage.setItem('sentinel_filter_holder_max', filterSettings.holderMax);
                    localStorage.setItem('sentinel_filter_graduated', filterSettings.graduatedOnly);
                    localStorage.setItem('sentinel_filter_platforms', JSON.stringify(filterSettings.platforms));
                    localStorage.setItem('sentinel_filter_table', filterSettings.applyToTable);
                    
                    showToast(`Settings saved. Signal filters updated.`, 'success');
                    settingsModal.style.display = 'none';
                    
                    // Reload table if filters apply
                    if (filterSettings.applyToTable) loadCurrentTab();
                }

                btnSettings.addEventListener('click', () =&gt; { settingsModal.style.display = 'flex'; });
                settingsClose.onclick = () =&gt; { settingsModal.style.display = 'none'; };
                settingsBtnClose.onclick = saveSettings;

                async function safeFetch(url, options = {}, retries = 2, delay = 1000) {
                    for (let i = 0; i &lt; retries; i++) {
                        try {
                            const res = await fetch(url, options);
                            if (res.ok) {
                                const text = await res.text();
                                if (!text.trim()) continue;
                                try {
                                    const data = JSON.parse(text);
                                    if (data &amp;&amp; typeof data === 'object') return data;
                                } catch (parseErr) {}
                            }
                        } catch (e) {}
                        await new Promise(r =&gt; setTimeout(r, delay * (i + 1)));
                    }
                    throw new Error(`Failed after ${retries} attempts`);
                }

                // Clone likelihood algorithm
                function computeCloneLikelihood(token) {
                    let score = 0;
                    const name = (token.name || '').toLowerCase();
                    const symbol = (token.symbol || '').toLowerCase();
                    // Excessive length
                    if (name.length &gt; 30) score += 15;
                    if (symbol.length &gt; 10) score += 10;
                    // Contains repetitive patterns
                    const repetitive = /(.)\1{3,}/; // repeated character 4+ times
                    if (repetitive.test(name)) score += 20;
                    if (repetitive.test(symbol)) score += 10;
                    // Contains common scam keywords
                    const scamWords = ['pump', 'dump', 'scam', 'rug', 'safe', 'moon', 'floki', 'dogecoin', 'shiba', 'pepe', 'woof'];
                    let matches = 0;
                    scamWords.forEach(word =&gt; {
                        if (name.includes(word)) matches++;
                        if (symbol.includes(word)) matches++;
                    });
                    score += Math.min(30, matches * 5);
                    // Very new token with high supply and no liquidity
                    const ageHours = token.pairCreatedAt ? (Date.now() - token.pairCreatedAt) / 3600000 : 999;
                    if (ageHours &lt; 1 &amp;&amp; (token.marketCapFdv || 0) &lt; 5000) score += 20;
                    // All caps symbol (often used in scams)
                    if (token.symbol === token.symbol.toUpperCase() &amp;&amp; token.symbol.length &lt;= 5) score += 5;
                    // Contains numbers in name
                    if (/\d/.test(name)) score += 5;
                    return Math.min(100, Math.round(score));
                }

                // Enhanced safety score (0-100, higher = safer)
                function computeSafetyScore(token) {
                    let score = 50;
                    const liq = token.liquidity || 0;
                    if (liq &gt; 1_000_000) score += 25;
                    else if (liq &gt; 500_000) score += 20;
                    else if (liq &gt; 100_000) score += 15;
                    else if (liq &gt; 50_000) score += 10;
                    else if (liq &gt; 10_000) score += 5;
                    else if (liq &lt; 2_000) score -= 20;
                    else if (liq &lt; 5_000) score -= 10;

                    const vol = token.volume24h || 0;
                    if (vol &gt; 500_000) score += 20;
                    else if (vol &gt; 200_000) score += 15;
                    else if (vol &gt; 50_000) score += 10;
                    else if (vol &gt; 10_000) score += 5;
                    else if (vol &lt; 1_000) score -= 15;
                    else if (vol &lt; 5_000) score -= 5;

                    const ageHours = token.pairCreatedAt ? (Date.now() - token.pairCreatedAt) / 3600000 : 0;
                    if (ageHours &lt; 0.25) score -= 25;
                    else if (ageHours &lt; 1) score -= 15;
                    else if (ageHours &lt; 6) score -= 5;
                    else if (ageHours &gt; 24 &amp;&amp; ageHours &lt; 168) score += 10;
                    else if (ageHours &gt;= 168) score += 5;

                    const mcap = token.marketCapFdv || 0;
                    if (liq &gt; 0) {
                        const ratio = mcap / liq;
                        if (ratio &gt; 100) score -= 20;
                        else if (ratio &gt; 50) score -= 10;
                        else if (ratio &gt; 20) score -= 5;
                        else if (ratio &lt; 5) score += 10;
                        else if (ratio &lt; 10) score += 5;
                    }

                    const src = (token.source || '').toLowerCase();
                    if (src.includes('raydium') || src.includes('orca') || src.includes('meteora')) score += 10;
                    else if (src.includes('pump')) score -= 15;
                    else if (src.includes('heaven') || src.includes('bags')) score -= 10;
                    else if (src.includes('moonshot')) score -= 5;

                    const priceChange6h = token.priceChange6h || 0;
                    const priceChange24h = token.priceChange24h || 0;
                    if (priceChange6h &lt; -50) score -= 20;
                    else if (priceChange6h &lt; -20) score -= 10;
                    else if (priceChange6h &gt; 50) score += 15;
                    else if (priceChange6h &gt; 20) score += 10;
                    else if (priceChange6h &gt; 5) score += 5;

                    if (priceChange24h &lt; -70) score -= 25;
                    else if (priceChange24h &lt; -40) score -= 15;
                    else if (priceChange24h &gt; 100) score += 10;
                    else if (priceChange24h &gt; 30) score += 5;

                    const txns = token.raw?.txns?.h24?.buys + token.raw?.txns?.h24?.sells || 0;
                    if (txns &gt; 0 &amp;&amp; vol &gt; 0) {
                        const avgTxSize = vol / txns;
                        if (avgTxSize &gt; 5000) score -= 15;
                        else if (avgTxSize &lt; 200 &amp;&amp; txns &gt; 500) score += 10;
                    }

                    const symbol = (token.symbol || '').toUpperCase();
                    const name = (token.name || '').toUpperCase();
                    if (['BONK', 'JUP', 'RAY', 'ORCA', 'SAMO'].includes(symbol)) score += 20;
                    else if (symbol.includes('SOL') || name.includes('SOLANA')) score += 10;

                    if (liq &gt; 0 &amp;&amp; mcap &gt; 0 &amp;&amp; (mcap / liq) &gt; 100) score -= 15;

                    score = Math.min(100, Math.max(0, Math.round(score)));
                    return score;
                }

                async function fetchOneBatch(batchIndex) {
                    const queries = ['solana', 'pump', 'raydium', 'moonshot', 'orca'];
                    const queryIndex = batchIndex % 5;
                    const offset = batchIndex * 50;
                    let tokens = [];
                    try {

                        if (dex) tokens.push(...dex);
                        if (beye) tokens.push(...beye);
                    } catch (e) {
                        log(`Batch ${batchIndex+1} fetch error: ${e.message}`, 'error');
                    }
                    // deduplicate within this batch
                    const unique = [];
                    const seen = new Set();
                    for (let t of tokens) {
                        if (t &amp;&amp; t.address &amp;&amp; !seen.has(t.address)) {
                            seen.add(t.address);
                            unique.push(t);
                        }
                    }
                    return unique;
                }

                // ---- Apply filters to a token (for signals) ----
                async function passesFilters(token, forSignal = true) {
                    const ageHours = token.pairCreatedAt ? (Date.now() - token.pairCreatedAt) / 3600000 : null;
                    if (ageHours !== null) {
                        if (filterSettings.ageMin &gt; 0 &amp;&amp; ageHours &lt; filterSettings.ageMin) return false;
                        if (filterSettings.ageMax !== null &amp;&amp; ageHours &gt; filterSettings.ageMax) return false;
                    }
                    
                    const vol = token.volume24h || 0;
                    if (filterSettings.volMin &gt; 0 &amp;&amp; vol &lt; filterSettings.volMin) return false;
                    if (filterSettings.volMax !== null &amp;&amp; vol &gt; filterSettings.volMax) return false;
                    
                    if (filterSettings.graduatedOnly) {
                        const src = (token.source || '').toLowerCase();
                        if (!src.includes('raydium')) return false;
                    }
                    
                    if (filterSettings.platforms.length &gt; 0) {
                        const src = (token.source || '').toLowerCase();
                        let matched = false;
                        for (let p of filterSettings.platforms) {
                            if (src.includes(p)) { matched = true; break; }
                        }
                        if (!matched) return false;
                    }
                    
                    if (forSignal &amp;&amp; filterSettings.holderMax &lt; 100 &amp;&amp; token.address &amp;&amp; token.address !== '—') {
                        let holderPct = holderPercentCache.get(token.address);
                        if (holderPct === undefined) {
                            holderPct = await analyzeHoldersRPC(token.address);
                        }
                        if (holderPct !== null &amp;&amp; holderPct &gt; filterSettings.holderMax) return false;
                    }
                    
                    return true;

                // Score a token for a specific signal type
                function scoreToken(token, type, targetTier) {
                    let safety = computeSafetyScore(token);
                    if (token.address &amp;&amp; !token.address.startsWith('mock')) {
                        const cached = scoreCache.get(token.address);
                        if (cached !== undefined) safety = (safety + cached) / 2;
                    }
                    if (safety &lt; 40) return -1; // too risky
                    
                    const mcap = token.marketCapFdv;
                    const vol = token.volume24h;
                    const liq = token.liquidity;
                    const ageHours = token.pairCreatedAt ? (Date.now() - token.pairCreatedAt) / 3600000 : 999;
                    const priceChange6h = token.priceChange6h || 0;
                    
                    let score = 0;
                    if (type === 'run') {
                        // Heavy weight on momentum, volume, and youth
                        score += safety / 3; // safety still matters but less
                        if (ageHours &lt; 1) score += 50;
                        else if (ageHours &lt; 6) score += 30;
                        else if (ageHours &lt; 12) score += 15;
                        else if (ageHours &lt; 24) score += 5;
                        if (priceChange6h &gt; 20) score += 35;
                        else if (priceChange6h &gt; 10) score += 20;
                        else if (priceChange6h &gt; 5) score += 10;
                        if (vol &gt; mcap * 0.5) score += 30;
                        else if (vol &gt; mcap * 0.2) score += 15;
                        if (liq &gt; 0 &amp;&amp; vol / liq &gt; 1) score += 10; // healthy turnover
                    } else { // hodl
                        // Safety first, liquidity, low holder concentration, established age
                        score += safety * 0.8;
                        if (ageHours &gt; 24 &amp;&amp; ageHours &lt; 168) score += 20;
                        else if (ageHours &gt;= 168) score += 10;
                        if (liq &gt; mcap * 0.1) score += 25;
                        else if (liq &gt; mcap * 0.05) score += 15;
                        if (priceChange6h &gt; -10 &amp;&amp; priceChange6h &lt; 30) score += 10; // stable
                        // Holder concentration is already filtered, but if we have data we could reward low concentration
                    }
                    return score;
                }

                // Find best token for a given tier and type by scanning batches sequentially until found
                async function findBestTokenSequential(tier, type, skipAddresses = new Set()) {
                    const maxBatches = userBatchLimit;
                    for (let batchIdx = 0; batchIdx &lt; maxBatches; batchIdx++) {
                        const batchTokens = await fetchOneBatch(batchIdx);
                        if (!batchTokens.length) continue;
                        
                        let bestToken = null;
                        let bestScore = -Infinity;
                        for (let t of batchTokens) {
                            if (skipAddresses.has(t.address)) continue;
                            if (tier === 'NEW') {
                                const ageHours = t.pairCreatedAt ? (Date.now() - t.pairCreatedAt) / 3600000 : 999;
                                if (ageHours &gt; 6) continue;
                            }
                            if (!await passesFilters(t, true)) continue;
                            
                            const tokenTier = (t.marketCapFdv &lt; 10000) ? 'NEW' :
                                             (t.marketCapFdv &lt; 50000) ? 'LOW' :
                                             (t.marketCapFdv &lt; 150000) ? 'MID' :
                                             (t.marketCapFdv &lt; 500000) ? 'TRANSITION' : 'HIGH';
                            if (tokenTier !== tier) continue;
                            
                            const score = scoreToken(t, type, tier);
                            if (score &gt; bestScore) {
                                bestScore = score;
                                bestToken = t;
                            }
                        }
                        if (bestToken) {
                            log(`Found ${type} signal for ${tier} in batch ${batchIdx+1}: ${bestToken.symbol} (score ${bestScore.toFixed(1)})`);
                            return bestToken;
                        }
                    }
                    return null;
                }

                // --- Table functions with optional filters ---
                async function fetchAllBatchesForTable() {
                    let allTokens = [];
                    const limit = userBatchLimit;
                    for (let i = 0; i &lt; limit; i++) {
                        const batch = await fetchOneBatch(i);
                        allTokens.push(...batch);
                        // update progress bar
                        const overlay = document.getElementById('table-loading-overlay');
                        const progressBar = document.getElementById('table-progress-bar');
                        if (overlay &amp;&amp; progressBar) {
                            progressBar.style.width = `${((i+1) / limit) * 100}%`;
                        }
                    }
                    // deduplicate
                    const unique = [];
                    const seen = new Set();
                    for (let t of allTokens) {
                        if (t &amp;&amp; t.address &amp;&amp; !seen.has(t.address)) {
                            seen.add(t.address);
                            unique.push(t);
                        }
                    }
                    return unique;
                }

                async function getTokens(tab) {
                    await fetchSolPrice();
                    const overlay = document.getElementById('table-loading-overlay');
                    const progressBar = document.getElementById('table-progress-bar');
                    if (overlay) overlay.style.display = 'flex';
                    if (progressBar) progressBar.style.width = '0%';
                    
                    let tokens = await fetchAllBatchesForTable();
                    
                    if (overlay) overlay.style.display = 'none';
                    
                    if (!tokens || tokens.length === 0) return [];
                    
                    // Apply filters to table if enabled
                    if (filterSettings.applyToTable) {
                        const filtered = [];
                        for (let t of tokens) {
                            if (await passesFilters(t, false)) filtered.push(t);
                        }
                        tokens = filtered;
                    }
                    
                    let sorted = [...tokens];
                    if (tab === 'new') {
                        sorted.sort((a, b) =&gt; (b.pairCreatedAt || 0) - (a.pairCreatedAt || 0));
                    } else if (tab === 'volume') {
                        sorted.sort((a, b) =&gt; (b.volume24h || 0) - (a.volume24h || 0));
                    } else if (tab === 'mcap') {
                        sorted.sort((a, b) =&gt; (b.marketCapFdv || 0) - (a.marketCapFdv || 0));
                    } else if (tab === 'trending') {
                        sorted.sort((a, b) =&gt; {
                            const scoreA = (a.volume24h * 0.7) + (a.liquidity * 0.3);
                            const scoreB = (b.volume24h * 0.7) + (b.liquidity * 0.3);
                            return scoreB - scoreA;
                        });
                    } else if (tab === 'boosted') {
                        sorted.sort((a, b) =&gt; {
                            const mcapA = a.marketCapFdv || 1;
                            const mcapB = b.marketCapFdv || 1;
                            const boostA = (a.volume24h / mcapA) * (1 + Math.max(0, (a.priceChange6h || 0) / 100));
                            const boostB = (b.volume24h / mcapB) * (1 + Math.max(0, (b.priceChange6h || 0) / 100));
                            return boostB - boostA;
                        });
                    }
                    
                    sorted = sorted.slice(0, 50);
                    for (let t of sorted) {
                        t.safetyScore = computeSafetyScore(t);
                    }
                    return sorted;
                }

                function renderTable(tokens) {
                    tableBody.innerHTML = '';
                    emptyState.style.display = tokens.length ? 'none' : 'block';
                    tokens.forEach((t, i) =&gt; {
                        const priceUsd = t.priceUsd;
                        const priceSol = solUsdPrice ? priceUsd / solUsdPrice : 0;
                        const vol = t.volume24h;
                        const mcap = t.marketCapFdv;
                        const safetyScore = t.safetyScore;
                        const rugPercent = getRugPercent(safetyScore);
                        let riskClass = 'status-med';
                        let riskText = 'Medium';
                        if (safetyScore &gt;= 70) {
                            riskClass = 'status-low';
                            riskText = 'Low';
                        } else if (safetyScore &lt; 40) {
                            riskClass = 'status-high';
                            riskText = 'High';
                        }
                        const tr = document.createElement('tr');
                        tr.dataset.token = JSON.stringify(t.raw || t).replace(/'/g, "'");
                        tr.style.cursor = 'pointer';
                        tr.innerHTML = `
                            &lt;td title="${i+1}"&gt;${i+1}&lt;/td&gt;
                            &lt;td title="${t.name}"&gt;${t.name}&lt;/td&gt;
                            &lt;td title="${t.symbol}"&gt;${t.symbol}&lt;/td&gt;
                            &lt;td title="${t.source || '—'}"&gt;${formatSourceBadge(t.source)}&lt;/td&gt;
                            &lt;td title="${priceUsd}"&gt;${formatUSD(priceUsd)}&lt;/td&gt;
                            &lt;td class="sol-price" title="${priceSol} SOL"&gt;${formatSOL(priceSol)}&lt;/td&gt;
                            &lt;td title="${vol}"&gt;${formatUSD(vol)}&lt;/td&gt;
                            &lt;td title="${mcap}"&gt;${formatUSD(mcap)}&lt;/td&gt;
                            &lt;td title="Safety score ${safetyScore}"&gt;${safetyScore}&lt;/td&gt;
                            &lt;td title="Estimated risk ${rugPercent}%"&gt;${rugPercent}%&lt;/td&gt;
                            &lt;td class="${riskClass}" title="${riskText} risk"&gt;${riskText}&lt;/td&gt;
                            &lt;td&gt;&lt;button class="view-btn" data-token='${JSON.stringify(t.raw || t).replace(/'/g, "'")}'&gt;View&lt;/button&gt;&lt;/td&gt;
                        `;
                        tableBody.appendChild(tr);
                    });
                }

                async function loadCurrentTab() {
                    const active = document.querySelector('.tab-btn.active');
                    if (!active) return;
                    const tab = active.dataset.tab;
                    tableBody.innerHTML = `&lt;tr&gt;&lt;td colspan="12" style="text-align:center; padding: 30px; color: var(--accent);"&gt;Aggregating deep market data... please wait.&lt;/td&gt;&lt;/tr&gt;`;
                    emptyState.style.display = 'none';
                    const tokens = await getTokens(tab);
                    renderTable(tokens);
                }

                function showHelp(helpKey) {
                    const text = helpTexts[helpKey];
                    if (!text) return;
                    helpTitle.textContent = `Help: ${helpKey.replace('-', ' ')}`;
                    helpContent.textContent = text;
                    helpModal.style.display = 'flex';
                }

                btnAbout.addEventListener('click', () =&gt; { aboutModal.style.display = 'flex'; });
                aboutClose.onclick = () =&gt; { aboutModal.style.display = 'none'; };
                aboutBtnClose.onclick = () =&gt; { aboutModal.style.display = 'none'; };
                aboutModal.onclick = (e) =&gt; { if (e.target === aboutModal) aboutModal.style.display = 'none'; };

                document.querySelectorAll('.help-icon').forEach(icon =&gt; {
                    icon.addEventListener('click', (e) =&gt; {
                        e.stopPropagation();
                        const helpKey = icon.dataset.help;
                        if (helpKey) showHelp(helpKey);
                    });
                });
                document.querySelectorAll('.help-icon-small').forEach(icon =&gt; {
                    icon.addEventListener('click', (e) =&gt; {
                        e.stopPropagation();
                        const helpKey = icon.dataset.help;
                        if (helpKey) showHelp(helpKey);
                    });
                });

                document.querySelector('.help-modal-close').onclick = () =&gt; { helpModal.style.display = 'none'; };
                helpModal.onclick = (e) =&gt; { if (e.target === helpModal) helpModal.style.display = 'none'; };

                document.querySelector('.modal-close').onclick = () =&gt; modal.style.display = 'none';
                document.querySelector('.close-button').onclick = () =&gt; modal.style.display = 'none';
                modal.onclick = e =&gt; { if (e.target === modal) modal.style.display = 'none'; };

                document.querySelectorAll('.tab-btn').forEach(btn =&gt; {
                    if (btn.id === 'btn-about') return;
                    btn.addEventListener('click', () =&gt; {
                        document.querySelectorAll('.tab-btn').forEach(b =&gt; b.classList.remove('active'));
                        btn.classList.add('active');
                        loadCurrentTab();
                    });
                });

                document.getElementById('search-btn').addEventListener('click', async () =&gt; {
                    const q = document.getElementById('search-input').value.trim();
                    if (!q) return showToast('Enter a CA or wallet address', 'warn');
                    showToast('Searching...', 'info');
                    try {
                        if (q.length &gt;= 32 &amp;&amp; q.length &lt;= 44) { 
                            const res = await safeFetch(`https://api.dexscreener.com/latest/dex/tokens/${q}`);
                            if (res &amp;&amp; res.pairs &amp;&amp; res.pairs.length &gt; 0) {
                                showModal(res.pairs[0]);
                                showToast('Token found!', 'success');
                            } else {
                                showToast('Opening Wallet Portfolio...', 'info');
                                showWalletModal(q);
                            }
                        } else {
                            showToast('Invalid format. Must be Solana CA or Wallet.', 'error');
                        }
                    } catch (e) {
                        showToast('Search error: ' + e.message, 'error');
                    }
                });

                tableBody.addEventListener('click', (e) =&gt; {
                    const row = e.target.closest('tr');
                    if (!row) return;
                    if (e.target.classList.contains('view-btn')) {
                        e.stopPropagation();
                        const token = JSON.parse(e.target.dataset.token);
                        showModal(token);
                        return;
                    }
                    if (row.dataset.token) {
                        const token = JSON.parse(row.dataset.token);
                        showModal(token);
                    }
                });

                // Load table first
                loadCurrentTab().then(() =&gt; {
                    // After table loads, start signals (already have setTimeout, but we can ensure table loaded)
                });
                // Keep periodic table refresh
                setInterval(loadCurrentTab, 180000);
            }
        })();
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
</textarea>
